<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcel Routing Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800 p-4 sm:p-8">
    <div class="max-w-5xl mx-auto">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <!-- Header -->
            <div class="bg-indigo-700 px-8 py-5 flex items-center justify-between">
                <h2 class="text-white text-2xl font-bold tracking-tight">Routing Engine</h2>
                <span class="bg-indigo-800 text-indigo-100 px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider">v1.0 Live</span>
            </div>
            
            <div class="p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                <!-- Left Column: Input Form (Takes up 5 columns on large screens) -->
                <div class="lg:col-span-5">
                    <h3 class="text-xl font-bold mb-5 text-gray-900 border-b pb-3">New Parcel</h3>
                    
                    <form id="routingForm" class="space-y-5">
                        <!-- Security -->
                        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Authorization</label>
                            <input type="password" id="apiKey" value="default-dev-secret-key" class="block w-full rounded-md border-gray-300 shadow-sm border p-2.5 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                            <p class="mt-1 text-xs text-gray-500">API Key is required for this request.</p>
                        </div>

                        <!-- Parcel Data -->
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Weight (kg)</label>
                                <input type="number" id="weight" step="0.1" value="0.5" required class="block w-full rounded-md border-gray-300 shadow-sm border p-2.5 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Value (EUR)</label>
                                <input type="number" id="value" step="0.1" value="150" required class="block w-full rounded-md border-gray-300 shadow-sm border p-2.5 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Destination Country</label>
                            <select id="country" required class="block w-full rounded-md border-gray-300 shadow-sm border p-2.5 bg-white focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm font-medium">
                                <option value="US" selected>🇺🇸 US - United States</option>
                                <option value="IN">🇮🇳 IN - India</option>
                                <option value="GB">🇬🇧 GB - United Kingdom</option>
                                <option value="CA">🇨🇦 CA - Canada</option>
                                <option value="DE">🇩🇪 DE - Germany</option>
                                <option value="FR">🇫🇷 FR - France</option>
                                <option value="JP">🇯🇵 JP - Japan</option>
                            </select>
                        </div>
                        
                        <!-- Actions -->
                        <div class="pt-2">
                            <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all shadow-md hover:shadow-lg">
                                Process Routing
                            </button>
                            <button type="button" id="forceCrashBtn" class="mt-3 w-full flex justify-center py-2 px-4 border border-red-300 rounded-lg shadow-sm text-xs font-semibold text-red-600 bg-white hover:bg-red-50 transition-colors">
                                Simulate System Crash
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Right Column: Results Dashboard (Takes up 7 columns on large screens) -->
                <div class="lg:col-span-7 bg-gray-50 rounded-xl border border-gray-200 overflow-hidden flex flex-col">
                    <div class="bg-gray-100 px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                        <h3 class="text-lg font-bold text-gray-800">Routing Result</h3>
                        <span id="reqIdDisplay" class="text-xs font-mono text-gray-500">Awaiting...</span>
                    </div>
                    
                    <!-- Loading State -->
                    <div id="loading" class="hidden flex-1 flex flex-col items-center justify-center p-12 text-indigo-600">
                        <svg class="animate-spin h-10 w-10 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <p class="font-medium animate-pulse">Evaluating rules...</p>
                    </div>

                    <!-- Clean UI Output -->
                    <div id="cleanOutput" class="flex-1 p-6 flex flex-col justify-center items-center text-center opacity-50 transition-opacity duration-300">
                        <div class="text-gray-400 mb-2">
                            <svg class="mx-auto h-16 w-16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                            </svg>
                        </div>
                        <p class="text-gray-500 font-medium">Submit a parcel to see routing decision.</p>
                    </div>
                    
                    <!-- Raw JSON Toggle (Optional for debugging) -->
                    <details class="bg-white border-t border-gray-200">
                        <summary class="cursor-pointer px-6 py-3 text-sm font-semibold text-gray-600 hover:bg-gray-50 transition-colors">View Raw JSON Response</summary>
                        <div class="p-4 bg-gray-900 overflow-x-auto">
                            <pre id="rawOutput" class="text-green-400 text-xs font-mono"></pre>
                        </div>
                    </details>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('routingForm');
        const crashBtn = document.getElementById('forceCrashBtn');
        const cleanOutput = document.getElementById('cleanOutput');
        const rawOutput = document.getElementById('rawOutput');
        const loading = document.getElementById('loading');
        const reqIdDisplay = document.getElementById('reqIdDisplay');

        // Function to build the beautiful result card
        function renderSuccessCard(data) {
            return `
                <div class="w-full text-left space-y-6 animate-fade-in-up">
                    <div class="flex items-center justify-between">
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-bold bg-green-100 text-green-800 border border-green-200">
                            <svg class="mr-1.5 h-4 w-4 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                            </svg>
                            ${data.status}
                        </span>
                        <span class="text-sm text-gray-500 font-mono">ID: ${data.parcel_id}</span>
                    </div>

                    <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                        <h4 class="text-xs uppercase tracking-wider text-gray-500 font-bold mb-1">Target Department</h4>
                        <div class="text-3xl font-extrabold text-indigo-700">${data.department}</div>
                        <p class="text-sm text-gray-600 mt-2 flex items-start">
                            <svg class="h-5 w-5 text-indigo-400 mr-2 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            ${data.reason}
                        </p>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                            <div class="text-xs text-gray-500 font-bold uppercase">Weight</div>
                            <div class="text-xl font-semibold text-gray-800">${data.weight_kg} kg</div>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                            <div class="text-xs text-gray-500 font-bold uppercase">Value</div>
                            <div class="text-xl font-semibold text-gray-800">€ ${data.value_eur}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderErrorCard(status, message) {
            return `
                <div class="w-full flex flex-col items-center justify-center text-center p-6 animate-fade-in-up">
                    <div class="bg-red-100 p-4 rounded-full mb-4">
                        <svg class="h-10 w-10 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                    </div>
                    <h3 class="text-xl font-bold text-gray-900 mb-2">Request Failed (${status})</h3>
                    <p class="text-red-600 font-medium bg-red-50 px-4 py-2 rounded-lg border border-red-100">${message}</p>
                </div>
            `;
        }

        async function sendRequest(url, payload = null) {
            cleanOutput.innerHTML = '';
            rawOutput.textContent = '';
            reqIdDisplay.textContent = 'Processing...';
            
            cleanOutput.classList.add('hidden');
            loading.classList.remove('hidden');
            
            const apiKey = document.getElementById('apiKey').value;
            const options = {
                method: 'POST',
                headers: {
                    'X-API-Key': apiKey,
                    'Content-Type': 'application/json'
                }
            };
            if (payload) options.body = JSON.stringify(payload);

            try {
                const response = await fetch(url, options);
                const reqId = response.headers.get('X-Request-ID') || 'No ID';
                reqIdDisplay.textContent = `Req ID: ${reqId.split('-')[0]}...`;
                
                const data = await response.json();
                
                // Set Raw JSON for developers
                rawOutput.textContent = JSON.stringify(data, null, 2);
                rawOutput.className = response.ok ? "text-green-400 text-xs font-mono" : "text-red-400 text-xs font-mono";
                
                // Render beautiful UI for users
                if (response.ok) {
                    cleanOutput.innerHTML = renderSuccessCard(data);
                } else {
                    let errorMsg = data.detail;
                    if (typeof errorMsg === 'object') errorMsg = JSON.stringify(errorMsg);
                    cleanOutput.innerHTML = renderErrorCard(response.status, errorMsg);
                }
            } catch (err) {
                cleanOutput.innerHTML = renderErrorCard("Network", err.message);
                rawOutput.textContent = `Network Error: ${err.message}`;
            } finally {
                loading.classList.add('hidden');
                cleanOutput.classList.remove('hidden');
                cleanOutput.classList.remove('opacity-50');
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const payload = {
                weight: parseFloat(document.getElementById('weight').value),
                value: parseFloat(document.getElementById('value').value),
                country: document.getElementById('country').value
            };
            sendRequest('/api/v1/route', payload);
        });

        crashBtn.addEventListener('click', () => {
            sendRequest('/api/v1/force-error');
        });
    </script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
    </style>
</body>
</html>
